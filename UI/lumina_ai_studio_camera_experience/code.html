<div class="bg-surface-container-highest/95 backdrop-blur-xl px-10 py-6 rounded-full flex items-center gap-12 border border-outline-variant/30 shadow-2xl" style="transform: translate(0.553125px, 1.87109px);">
<button class="p-4 rounded-full text-on-surface-variant hover:text-white hover:bg-white/5 transition-all">
<span class="material-symbols-outlined text-[28px]">flip_camera_ios</span>
</button>
<button class="p-4 rounded-full text-on-surface-variant hover:text-white hover:bg-white/5 transition-all">
<span class="material-symbols-outlined text-[28px]">timer</span>
</button>
<!-- Main Capture Button -->
<button class="relative group" id="capture-btn">
<div class="absolute -inset-4 bg-primary/20 blur-xl rounded-full group-hover:bg-primary/40 transition-all"></div>
<div class="relative w-20 h-20 bg-white rounded-full flex items-center justify-center capture-button-ring group-active:scale-90 transition-transform">
<div class="w-16 h-16 border-2 border-background rounded-full"></div>
</div>
</button>
<button class="p-4 rounded-full text-on-surface-variant hover:text-white hover:bg-white/5 transition-all">
<span class="material-symbols-outlined text-[28px]">flash_on</span>
</button>
<button class="p-4 rounded-full text-on-surface-variant hover:text-white hover:bg-white/5 transition-all">
<span class="material-symbols-outlined text-[28px]">settings</span>
</button>
</div>
</footer>
<script>
        // Particle background generation
        const container = document.getElementById('particles-container');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            const size = Math.random() * 3 + 1;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.top = `${Math.random() * 100}%`;
            particle.style.animationDelay = `${Math.random() * 20}s`;
            particle.style.animationDuration = `${15 + Math.random() * 15}s`;
            container.appendChild(particle);
        }

        // Simple capture interaction logic
        const captureBtn = document.getElementById('capture-btn');
        const countdownEl = document.getElementById('countdown');
        const countdownText = countdownEl.querySelector('span');
        const processingOverlay = document.getElementById('processing-overlay');

        captureBtn.addEventListener('click', () => {
            let count = 3;
            countdownEl.style.opacity = '1';
            countdownText.innerText = count;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownText.innerText = count;
                    countdownText.style.transform = 'scale(1.5)';
                    setTimeout(() => countdownText.style.transform = 'scale(1)', 100);
                } else {
                    clearInterval(timer);
                    countdownEl.style.opacity = '0';
                    flashEffect();
                }
            }, 1000);
        });

        function flashEffect() {
            // Flash simulation
            const flash = document.createElement('div');
            flash.className = 'fixed inset-0 bg-white z-[60] opacity-100 transition-opacity duration-300';
            document.body.appendChild(flash);
            
            setTimeout(() => {
                flash.style.opacity = '0';
                setTimeout(() => flash.remove(), 300);
                showProcessing();
            }, 50);
        }

        function showProcessing() {
            processingOverlay.style.opacity = '1';
            processingOverlay.style.pointerEvents = 'auto';
            
            setTimeout(() => {
                processingOverlay.style.opacity = '0';
                processingOverlay.style.pointerEvents = 'none';
                // Trigger success visual here if needed
            }, 3000);
        }

        // Subtle parallax on mouse move
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            document.querySelectorAll('.glass-panel').forEach(panel => {
                panel.style.transform = `translate(${x * 0.2}px, ${y * 0.2}px)`;
            });
        });
    </script>


</body></html>
